apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "identity.name" . }}-products
data:
  products.json: {{ .Values.products | toJson | quote }}
---
{{- if .Values.database.create }}
{{- $db := lookup "postgresql.cnpg.io/v1" "Cluster" .Release.Namespace .Values.database.name }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.database.name }}
  labels: {app.kubernetes.io/managed-by: Helm}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
    helm.sh/resource-policy: keep
    {{- if and .Release.IsInstall (not $db) }}
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    {{- end }}
spec:
  instances: {{ .Values.database.instances }}
  imageName: {{ .Values.database.image | quote }}
  storage: {size: {{ .Values.database.size }}}
  bootstrap:
    initdb: {database: zitadel, owner: zitadel}
  postgresql:
    parameters: {shared_buffers: 64MB, max_connections: "100"}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
---
{{- end }}
{{- $old := lookup "v1" "Secret" .Release.Namespace .Values.zitadel.zitadel.masterkeySecretName }}
{{- $owned := and $old (eq (index (default dict $old.metadata.annotations) "meta.helm.sh/release-name") .Release.Name) }}
{{- if or (not $old) $owned }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.zitadel.zitadel.masterkeySecretName }}
  labels: {app.kubernetes.io/managed-by: Helm}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
    helm.sh/resource-policy: keep
    {{- if and .Release.IsInstall (not $old) }}
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    {{- end }}
type: Opaque
immutable: true
data:
  masterkey: {{ if $old }}{{ index $old.data "masterkey" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}

{{- end }}
