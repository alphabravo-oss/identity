apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "identity.name" . }}-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "identity.name" . }}-bootstrap
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "identity.name" . }}-bootstrap
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "identity.name" . }}-bootstrap}
subjects:
  - {kind: ServiceAccount, name: {{ include "identity.name" . }}-bootstrap}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "identity.name" . }}-bootstrap-{{ .Release.Revision }}
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {app.kubernetes.io/component: identity-bootstrap}
    spec:
      serviceAccountName: {{ include "identity.name" . }}-bootstrap
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532}
      containers:
        - name: bootstrap
          image: {{ include "identity.image" .Values.images.bootstrap | quote }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {memory: 128Mi}}
          env:
            - {name: ENGINE_API, value: "http://{{ .Values.zitadel.fullnameOverride }}:8080"}
            - {name: ENGINE_ADDRESS, value: "{{ .Values.zitadel.fullnameOverride }}:8080"}
            - {name: ENGINE_HOST, value: {{ .Values.zitadel.zitadel.configmapConfig.ExternalDomain | quote }}}
            - {name: PUBLIC_ISSUER, value: "https://{{ .Values.zitadel.zitadel.configmapConfig.ExternalDomain }}"}
            - {name: ORGANIZATION, value: {{ .Values.organization | quote }}}
            - {name: SECRET_PREFIX, value: {{ .Values.secretPrefix | quote }}}
            - {name: ADMIN_PAT_FILE, value: /admin/pat}
            - {name: RUNTIME_SECRET, value: "{{ include "identity.name" . }}-runtime"}
            - {name: ACTION_NAME, value: "{{ include "identity.name" . }}-roles"}
            - {name: CLAIMS_ENDPOINT, value: "http://{{ include "identity.name" . }}-signin:8090/claims"}
          volumeMounts:
            - {name: products, mountPath: /config, readOnly: true}
            - {name: admin, mountPath: /admin, readOnly: true}
      volumes:
        - name: products
          configMap: {name: "{{ include "identity.name" . }}-products"}
        - name: admin
          secret: {secretName: iam-admin-pat}
