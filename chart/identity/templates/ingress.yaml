{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "identity.name" . }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.zitadel.zitadel.configmapConfig.ExternalDomain | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.zitadel.zitadel.configmapConfig.ExternalDomain | quote }}
      http:
        paths:
          - path: /.well-known/openid-configuration
            pathType: Exact
            backend: {service: {name: {{ .Values.zitadel.fullnameOverride }}, port: {number: 8080}}}
          {{- range list "/oauth/v2" "/oidc/v1" }}
          - path: {{ . }}
            pathType: Prefix
            backend: {service: {name: {{ $.Values.zitadel.fullnameOverride }}, port: {number: 8080}}}
          {{- end }}
          {{- range list "/signin" "/logout/done" "/idps" }}
          - path: {{ . }}
            pathType: Prefix
            backend: {service: {name: {{ include "identity.name" $ }}-signin, port: {number: 8080}}}
          {{- end }}
{{- end }}
